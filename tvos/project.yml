name: GymTV
options:
  bundleIdPrefix: co.learntoreadthai
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GymTV:
    type: application
    platform: tvOS
    sources: [GymTV]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.learntoreadthai.gymtv
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  GymTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [GymTVTests]
    dependencies:
      - target: GymTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
